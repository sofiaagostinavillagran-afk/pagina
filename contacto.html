            <h1>Contáctanos</h1>
            <p>Envianos tus datos y comentarios para ponernos en contacto contigo a la brevedad.</p>
            
            <form action="#">
                <fieldset>
                    <legend>Datos personales</legend>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre">
                    <label for="apellido">Apellido</label>

                </fieldset>
                <label>Comentarios <textarea name="comentario" placeholder="Escribí tu comentario"></textarea></label>
                <button type="submit">Enviar</button>
            </form>
        </section>
